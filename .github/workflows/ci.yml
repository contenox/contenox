# CI: contenox compile smoke, Windows cross-compile smoke, CLI help smoke, and cheap TestUnit_* Go tests.
# No TestSystem_* / Docker / LLM integration tests.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Build contenox (compile smoke)
        run: task build

      - name: Build contenox for Windows (compile smoke)
        run: task build-windows

      - name: CLI help smoke
        run: task test-cli-help

      - name: Cheap Go tests (TestUnit_* + -short only)
        run: task test-unit
